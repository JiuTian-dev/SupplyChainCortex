# SupplyChain Cortex — Prometheus Scrape Configuration
#
# Loaded by the Prometheus container (see docker-compose.prod.yml).
# Targets are addressed via Docker DNS on the `cortex-prod` network.
#
# Reload without restart:
#   curl -X POST http://localhost:9090/-/reload
# (requires --web.enable-lifecycle)

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: supply-chain-cortex
    environment: production

# ─── Alerting Rules ─────────────────────────────────────────────────────────
rule_files:
  - /etc/prometheus/rules/*.yml

# ─── Alertmanager (optional) ────────────────────────────────────────────────
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# ─── Scrape Targets ─────────────────────────────────────────────────────────
scrape_configs:
  # ── Next.js application (/metrics endpoint) ──────────────────────────────
  - job_name: cortex-app
    metrics_path: /api/metrics
    scheme: http
    scrape_interval: 15s
    scrape_timeout: 10s
    # Optional Basic Auth — set the same METRICS_BASIC_AUTH env var on the app.
    # basic_auth:
    #   username: prometheus
    #   password: ${METRICS_PASSWORD}
    static_configs:
      - targets: ['app:3000']
        labels:
          service: supply-chain-cortex
          component: nextjs
          runtime: nodejs

  # ── Python FastAPI bridge (supply-chain math engine) ─────────────────────
  - job_name: cortex-python-bridge
    metrics_path: /metrics
    scheme: http
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['python-bridge:8765']
        labels:
          service: supply-chain-cortex
          component: python-bridge
          runtime: python

  # ── PostgreSQL exporter ──────────────────────────────────────────────────
  - job_name: postgres-exporter
    metrics_path: /metrics
    scheme: http
    scrape_interval: 30s
    scrape_timeout: 15s
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: supply-chain-cortex
          component: postgres

  # ── Redis exporter ───────────────────────────────────────────────────────
  - job_name: redis-exporter
    metrics_path: /metrics
    scheme: http
    scrape_interval: 30s
    scrape_timeout: 15s
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: supply-chain-cortex
          component: redis

  # ── Prometheus self-monitoring ───────────────────────────────────────────
  - job_name: prometheus
    metrics_path: /metrics
    scheme: http
    scrape_interval: 30s
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: supply-chain-cortex
          component: prometheus
