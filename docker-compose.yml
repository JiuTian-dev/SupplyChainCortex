# ===========================================
# SupplyChain Cortex — Docker Compose
# ===========================================
# PostgreSQL is the only supported database.
#
#   docker compose up -d postgres     → PostgreSQL on localhost:5432
#   docker compose up -d              → full stack (app + postgres + searxng)
#   docker compose --profile tools up -d → add pgAdmin on port 5050
#   docker compose down -v            → stop + delete data volumes
#
# First-time setup:
#   1. cp .env.example .env
#   2. docker compose up -d postgres
#   3. bun run db:push
#   4. bun run db:seed
# ===========================================

services:
  # ─── Next.js Application ────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supply-chain-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://supplychain:supplychain@postgres:5432/supply_chain
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me-in-production-at-least-32-chars-long}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NODE_ENV=${NODE_ENV:-production}
      - DB_TYPE=${DB_TYPE:-postgresql}
      - SEARCH_PROVIDER=${SEARCH_PROVIDER:-searxng}
      - SEARXNG_BASE_URL=http://searxng:8080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - supply-chain-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ─── SearXNG — Self-hosted meta search engine (70+ engines, zero API keys) ──
  searxng:
    image: searxng/searxng:latest
    container_name: supply-chain-searxng
    restart: unless-stopped
    ports:
      - "${SEARXNG_PORT:-8081}:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./searxng/limiter.toml:/etc/searxng/limiter.toml:ro
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:-supply-chain-cortex-searxng-secret-key}
    networks:
      - supply-chain-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # ─── PostgreSQL 16 ──────────────────────────────────────────────────
  # Backups: ./scripts/backup-db.sh       (manual)
  # Cron:    0 3 * * * ./scripts/backup-db.sh >> /var/log/sc-backup.log 2>&1
  postgres:
    image: postgres:16-alpine
    container_name: supply-chain-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-127.0.0.1:5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supplychain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supplychain}
      POSTGRES_DB: ${POSTGRES_DB:-supply_chain}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - supply-chain-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supplychain} -d ${POSTGRES_DB:-supply_chain}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  # ─── pgAdmin (optional - database management UI) ────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: supply-chain-pgadmin
    restart: unless-stopped
    profiles:
      - tools
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@supplychain.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - supply-chain-network

# ─── Volumes ──────────────────────────────────────────────────────────
volumes:
  postgres-data:
    driver: local
    name: supply-chain-postgres-data

# ─── Network ──────────────────────────────────────────────────────────
networks:
  supply-chain-network:
    driver: bridge
    name: supply-chain-network
