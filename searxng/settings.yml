# SearXNG configuration for SupplyChain Cortex
# Docs: https://docs.searxng.org/admin/settings/

use_default_settings: true

server:
  secret_key: "${SEARXNG_SECRET}"
  bind_address: "0.0.0.0"
  limiter: false
  image_proxy: false
  method: "GET"

search:
  formats:
    - html
    - json
  safe_search: 2
  default_lang: "auto"
  autocomplete: ""

enabled_plugins:
  - "Hash plugin"
  - "ahmia_filter"

ui:
  static_use_hash: true
  default_theme: simple

engines:
  - name: google
    disabled: false
    categories: [general]
    timeout: 7.0
  - name: duckduckgo
    disabled: false
    categories: [general]
    timeout: 7.0
  - name: bing
    disabled: false
    categories: [general]
    timeout: 7.0
  - name: wikipedia
    disabled: false
    categories: [research]
    timeout: 5.0
  - name: github
    disabled: false
    categories: [it]
    timeout: 5.0
  - name: bing news
    disabled: false
    categories: [news]
    timeout: 7.0

outgoing:
  request_timeout: 10.0
  useragent_suffix: "SupplyChainCortex/2.9"
